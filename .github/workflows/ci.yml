name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare checksum-verified tools
        run: |
          ./Scripts/bootstrap_release_tools.sh build/release-tools/bin
          echo "$GITHUB_WORKSPACE/build/release-tools/bin" >> "$GITHUB_PATH"
          echo "PAPERWALL_UV_BINARY=$GITHUB_WORKSPACE/build/release-tools/bin/uv" >> "$GITHUB_ENV"

      - name: Scan repository history for secrets
        run: build/release-tools/bin/gitleaks git . --redact --no-banner

      - name: Validate shell scripts
        run: |
          for script in Scripts/*.sh; do
            bash -n "$script"
          done

      - name: Test playback core
        run: |
          xcodegen generate
          xcodebuild test \
            -project Paperwall.xcodeproj \
            -scheme PaperwallPlayback \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            MACOSX_DEPLOYMENT_TARGET=26.0

      - name: Build app
        run: |
          xcodebuild build \
            -project Paperwall.xcodeproj \
            -scheme PaperwallApp \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
