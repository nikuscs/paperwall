name: Paperwall
options:
  bundleIdPrefix: com.paperwall
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULES: true

targets:
  PaperwallPlayback:
    type: framework
    platform: macOS
    sources:
      - Sources/PaperwallPlayback
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperwall.playback
        GENERATE_INFOPLIST_FILE: true
        DEFINES_MODULE: true
        SKIP_INSTALL: true

  PaperwallApp:
    type: application
    platform: macOS
    sources:
      - Sources/PaperwallApp
      - path: Assets/AppIcon.icon
      - path: Assets/Brand/PaperwallLogo.svg
        buildPhase: resources
    dependencies:
      - target: PaperwallPlayback
      - target: PaperwallCLI
      - target: PaperwallScreenSaver
    postBuildScripts:
      - name: Embed CLI and Screen Saver
        script: |
          set -euo pipefail
          DESTINATION="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Installer"
          rm -rf "$DESTINATION"
          mkdir -p "$DESTINATION"
          cp "$BUILT_PRODUCTS_DIR/paperwall" "$DESTINATION/paperwall"
          chmod 755 "$DESTINATION/paperwall"
          /usr/bin/ditto "$BUILT_PRODUCTS_DIR/Paperwall.saver" "$DESTINATION/Paperwall.saver"
    entitlements:
      path: Config/PaperwallApp.entitlements
    info:
      path: Config/PaperwallApp-Info.plist
      properties:
        CFBundleDisplayName: Paperwall ®
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperwall.app
        PRODUCT_NAME: Paperwall
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: false

  PaperwallCLI:
    type: tool
    platform: macOS
    sources:
      - Sources/PaperwallCLI
      - Sources/PaperwallPlayback/PaperwallConfiguration.swift
      - Sources/PaperwallPlayback/VideoAssetValidator.swift
      - Sources/PaperwallPlayback/AssetLibrary.swift
      - Sources/PaperwallPlayback/LaunchAtLoginManager.swift
      - Sources/PaperwallPlayback/StaticWallpaperManager.swift
      - Sources/PaperwallPlayback/PaperwallService.swift
      - Sources/PaperwallPlayback/GenerationModels.swift
      - Sources/PaperwallPlayback/ReplicateClient.swift
      - Sources/PaperwallPlayback/ReplicateCredentialStore.swift
      - Sources/PaperwallPlayback/PaperwallGenerationService.swift
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperwall.cli
        PRODUCT_NAME: paperwall

  PaperwallScreenSaver:
    type: bundle
    platform: macOS
    sources:
      - Sources/PaperwallScreenSaver
    info:
      path: Config/PaperwallScreenSaver-Info.plist
      properties:
        NSPrincipalClass: PaperwallScreenSaverView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperwall.saver
        PRODUCT_NAME: Paperwall
        PRODUCT_MODULE_NAME: PaperwallScreenSaver
        WRAPPER_EXTENSION: saver
        MACH_O_TYPE: mh_bundle
        SKIP_INSTALL: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../Frameworks"
    dependencies:
      - sdk: ScreenSaver.framework
      - target: PaperwallPlayback
        embed: true

  PaperwallPlaybackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PaperwallPlaybackTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: PaperwallPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperwall.playback-tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  PaperwallApp:
    build:
      targets:
        PaperwallApp: all
    run:
      config: Debug
    archive:
      config: Release
  PaperwallCLI:
    build:
      targets:
        PaperwallCLI: all
    archive:
      config: Release
  PaperwallScreenSaver:
    build:
      targets:
        PaperwallScreenSaver: all
    archive:
      config: Release
  PaperwallPlayback:
    build:
      targets:
        PaperwallPlayback: all
        PaperwallPlaybackTests: [test]
    test:
      targets:
        - PaperwallPlaybackTests
